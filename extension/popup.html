<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嘉然直播点赞助手</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>嘉然直播点赞助手</h1>
      <a href="https://live.bilibili.com/22637261" target="_blank" rel="noreferrer">打开直播间 22637261 ↗</a>
    </header>

    <form>
      <div class="setting">
        <label for="count">本轮点赞次数</label>
        <input id="count" type="number" min="1" max="30" step="1" value="5" required disabled>
      </div>
      <p class="hint">每 3 秒触发一次，刷新页面后需重新授权。</p>
      <button id="start" type="submit" disabled>授权并开始</button>
      <button id="stop" type="button" hidden>停止本轮</button>
    </form>

    <p id="status" role="status" aria-live="polite">正在检查当前标签页…</p>
  </main>
</body>
</html>
